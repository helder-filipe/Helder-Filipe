<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Configurações para Web App (PWA) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#58cc02">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2090/2090259.png">

    <title>Mandarim Total - Pro</title>
    <style>
        :root {
            --duo-green: #58cc02; --duo-gray: #e5e5e5; --duo-text: #3c3c3c;
            --duo-red: #ff4b4b; --duo-blue: #1cb0f6; --duo-yellow: #ffc800;
            --duo-purple: #9b59b6; --duo-orange: #ff9600; --duo-teal: #2bcbba; --duo-pink: #fd79a8;
            --bg-wrong: #ffe0e0;
        }
        body { font-family: 'Segoe UI', sans-serif; color: var(--duo-text); display: flex; flex-direction: column; height: 100vh; max-width: 900px; margin: 0 auto; background: #fff; overflow: hidden; user-select: none; touch-action: manipulation; }
        
        /* HEADER */
        header { padding: 10px 20px; border-bottom: 2px solid var(--duo-gray); position: relative; background: white; z-index: 10; flex-shrink: 0; padding-top: env(safe-area-inset-top); }
        .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .stats-container { display: flex; gap: 15px; font-weight: bold; font-size: 1.1rem; }
        .xp-display { color: var(--duo-yellow); text-shadow: 1px 1px 0 #dceba6; } 
        .streak-display { color: var(--duo-red); }
        .timer-container { width: 100%; height: 8px; background: var(--duo-gray); border-radius: 4px; overflow: hidden; display: none; }
        .timer-bar { height: 100%; background: var(--duo-blue); width: 100%; transition: width 1s linear; }
        .timer-bar.critical { background: var(--duo-red); }

        /* MAIN & SCROLL */
        main { 
            flex-grow: 1; padding: 10px; 
            display: flex; flex-direction: column; 
            width: 100%; box-sizing: border-box; 
            overflow-y: auto; overflow-x: hidden;
            position: relative; height: 100%; 
            -webkit-overflow-scrolling: touch;
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        /* --- GAME: MATCH PAIRS --- */
        .game-board { display: flex; gap: 15px; width: 100%; height: 100%; }
        .column { flex: 1; display: flex; flex-direction: column; gap: 8px; height: 100%; }
        .column-title { text-align: center; font-weight: bold; color: #888; margin-bottom: 2px; text-transform: uppercase; font-size: 0.8rem; flex-shrink: 0; }
        .card { 
            border: 2px solid var(--duo-gray); border-radius: 12px; background: white; 
            min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            cursor: pointer; box-shadow: 0 3px 0 var(--duo-gray); text-align: center; 
            user-select: none; transition: transform 0.1s, background 0.2s; position: relative;
            touch-action: manipulation;
        }
        .card:active { transform: translateY(3px); box-shadow: none; }
        .card.selected { border-color: var(--duo-blue); background-color: #ddf4ff; transform: translateY(3px); box-shadow: none; }
        .card.matched { opacity: 0; pointer-events: none; transition: opacity 0.5s; }
        .card.wrong { border-color: var(--duo-red); background-color: var(--duo-red); color: white; animation: shake 0.4s; }
        .card.wrong .txt-py, .card.wrong .txt-zh { color: white; }

        .hard-mode .game-board { overflow: hidden; }
        .hard-mode .column { gap: 4px; }
        .hard-mode .card { min-height: 0; flex: 1; padding: 0; border-radius: 8px; }
        .hard-mode .txt-py { display: none; }
        .hard-mode .txt-zh { font-size: 1.3rem; line-height: 1; }
        .hard-mode .txt-pt { font-size: 0.85rem; line-height: 1; padding: 0 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

        /* --- GAME: QUIZ --- */
        .quiz-container { max-width: 600px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 20px; animation: slideIn 0.3s ease-out; }
        .quiz-question { font-size: 1.4rem; text-align: center; font-weight: bold; padding: 30px; background: #f7f7f7; border: 2px solid var(--duo-gray); border-radius: 16px; color: var(--duo-text); }
        .quiz-options { display: flex; flex-direction: column; gap: 12px; }
        .quiz-btn { 
            padding: 18px; font-size: 1.1rem; border: 2px solid var(--duo-gray); border-radius: 12px; background: white; 
            cursor: pointer; text-align: left; box-shadow: 0 4px 0 var(--duo-gray); transition: 0.1s; display: flex; justify-content: space-between;
        }
        .quiz-btn:active { transform: translateY(4px); box-shadow: none; }
        .quiz-btn:hover { background-color: #fcfcfc; border-color: var(--duo-blue); }
        .quiz-btn.correct { background: #d7ffb8 !important; border-color: #58cc02 !important; color: #2a6600; pointer-events: none; }
        .quiz-btn.wrong { background: #ffdfe0 !important; border-color: #ff4b4b !important; color: #a30000; pointer-events: none; }

        /* --- GAME: SENTENCE ASSEMBLE --- */
        .assemble-container { width: 100%; max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .assemble-prompt { font-size: 1.3rem; text-align: center; margin-bottom: 10px; color: #555; }
        .assemble-area { 
            min-height: 90px; border-bottom: 2px solid var(--duo-gray); border-top: 2px solid var(--duo-gray);
            display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px; justify-content: center;
            background: #fdfdfd; margin-bottom: 20px;
        }
        .word-bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 10px; }
        .word-chip, .word-chip-placed {
            background: white; border: 2px solid var(--duo-gray); border-radius: 12px; padding: 10px 15px; 
            cursor: pointer; box-shadow: 0 4px 0 var(--duo-gray); user-select: none; transition: transform 0.1s;
            display: flex; flex-direction: column; align-items: center; min-width: 40px; 
        }
        .chip-py { font-size: 0.75rem; color: #888; margin-bottom: 2px; font-weight: normal; }
        .chip-zh { font-size: 1.2rem; font-weight: bold; line-height: 1; }
        .word-chip:active { transform: translateY(4px); box-shadow: none; }
        .word-chip.used { opacity: 0; pointer-events: none; }
        .word-chip-placed { border-color: var(--duo-blue); box-shadow: 0 4px 0 #1480b3; color: var(--duo-blue); }
        .word-chip-placed .chip-py { color: #6dbfe2; }

        /* --- GAME: WRITE SENTENCE --- */
        .write-container { width: 100%; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; text-align: center; }
        .write-input { width: 90%; padding: 15px; font-size: 1.2rem; border: 2px solid var(--duo-gray); border-radius: 12px; outline: none; background: #f9f9f9; resize: none; height: 80px; margin: 0 auto; }
        .write-input:focus { border-color: var(--duo-blue); background: white; }
        .pinyin-keyboard { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0; max-width: 100%; }
        .pinyin-key { background: #fff; border: 1px solid var(--duo-gray); border-radius: 8px; padding: 10px 14px; font-size: 1.1rem; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,0.1); user-select: none; min-width: 40px; min-height: 40px; }
        .pinyin-key:active { transform: translateY(2px); box-shadow: none; }
        .pinyin-key:hover { border-color: var(--duo-blue); color: var(--duo-blue); }

        /* --- GAME: SPEECH --- */
        .speech-container { width: 100%; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; padding-top: 20px; }
        .speech-target-zh { font-size: 3rem; font-weight: bold; margin-bottom: 5px; }
        .speech-target-py { font-size: 1.5rem; color: #888; }
        .speech-target-pt { font-size: 1.2rem; color: var(--duo-blue); font-weight: bold; margin-top: 10px; }
        .mic-btn { width: 90px; height: 90px; border-radius: 50%; background: var(--duo-blue); border: none; color: white; font-size: 2.8rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.2s; display: flex; align-items: center; justify-content: center; margin: 20px auto; user-select: none; -webkit-tap-highlight-color: transparent; }
        .mic-btn:active { transform: scale(0.95); }
        .mic-btn.listening { background: var(--duo-red); animation: pulse 1.5s infinite; pointer-events: none; }
        @keyframes pulse { 0% {box-shadow: 0 0 0 0 rgba(255, 75, 75, 0.7);} 70% {box-shadow: 0 0 0 20px rgba(255, 75, 75, 0);} 100% {box-shadow: 0 0 0 0 rgba(255, 75, 75, 0);} }
        .speech-feedback { font-size: 1.1rem; min-height: 30px; font-weight: bold; color: #666; padding: 0 20px;}
        .speech-controls { display: flex; gap: 20px; margin-top: 20px; }

        /* --- GAME: HANZI WRITING (CANVAS) --- */
        .hanzi-container { width: 100%; max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .hanzi-prompt { text-align: center; margin-bottom: 5px; }
        
        .hanzi-canvas-wrapper { 
            position: relative; width: 300px; height: 300px; 
            border: 3px solid var(--duo-gray); border-radius: 12px; 
            background-image: linear-gradient(var(--duo-gray) 1px, transparent 1px), linear-gradient(90deg, var(--duo-gray) 1px, transparent 1px); 
            background-size: 150px 150px; background-position: center; 
            overflow: hidden; 
            /* Fix: garantir que não há ações de toque no wrapper */
            touch-action: none; 
            background-color: white;
        }
        
        /* Layering Canvases */
        #hanzi-bg-canvas { position: absolute; top:0; left:0; z-index: 1; pointer-events: none; }
        
        /* Fix: Pointer Events necessitam disto para não fazer scroll */
        #hanzi-canvas { 
            position: absolute; top:0; left:0; z-index: 2; 
            cursor: crosshair; 
            touch-action: none; 
        }

        .hanzi-controls { display: flex; gap: 10px; width: 300px; justify-content: space-between; }
        .hanzi-tool-btn { padding: 8px 12px; border-radius: 8px; border: 2px solid var(--duo-gray); background: white; font-weight: bold; cursor: pointer; }
        .hanzi-tool-btn:active { background: #eee; }
        .hanzi-feedback { margin-top: 10px; font-weight: bold; height: 24px; }

        /* --- FLASHCARDS --- */
        .flashcard-container { perspective: 1000px; width: 320px; height: 450px; margin: 10px auto; }
        .flashcard-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; border-radius: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .flashcard-inner.flipped { transform: rotateY(180deg); }
        .fc-face { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 20px; border: 2px solid var(--duo-gray); background: white; padding: 20px; box-sizing: border-box; }
        .fc-front { color: var(--duo-text); justify-content: space-between; padding-top: 40px; padding-bottom: 40px; }
        .fc-zh-main { font-size: 3.5rem; font-weight: bold; margin-bottom: 5px; }
        .fc-py-main { font-size: 1.5rem; color: #888; margin-bottom: 30px; }
        .fc-input { width: 80%; padding: 12px; font-size: 1.1rem; border: 2px solid var(--duo-gray); border-radius: 10px; outline: none; text-align: center; background: #f9f9f9; }
        .fc-input:focus { border-color: var(--duo-blue); background: white; }
        .fc-buttons-row { display: flex; gap: 10px; justify-content: center; width: 90%; margin-top: 15px; }
        .fc-check-btn { background: var(--duo-blue); color: white; border: none; padding: 12px 0; border-radius: 25px; font-size: 1rem; font-weight: bold; cursor: pointer; box-shadow: 0 3px 0 #1480b3; flex: 1; }
        .fc-check-btn:active { transform: translateY(3px); box-shadow: none; }
        .fc-giveup-btn { background: #95a5a6; color: white; border: none; padding: 12px 0; border-radius: 25px; font-size: 1rem; font-weight: bold; cursor: pointer; box-shadow: 0 3px 0 #7f8c8d; flex: 1; }
        .fc-giveup-btn:active { transform: translateY(3px); box-shadow: none; }
        .fc-back { transform: rotateY(180deg); background: #f0faff; justify-content: space-between; padding-top: 20px; padding-bottom: 30px; }
        .fc-mini-header { background: white; border: 1px solid var(--duo-gray); border-radius: 10px; padding: 8px 15px; margin-bottom: 10px; display: flex; flex-direction: column; align-items: center; width: 80%; box-shadow: 0 2px 0 rgba(0,0,0,0.05); }
        .fc-mini-zh { font-size: 1.5rem; font-weight: bold; color: #333; }
        .fc-mini-py { font-size: 0.9rem; color: #888; }
        .fc-result-area { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; width: 100%; gap: 15px; }
        .fc-label { font-size: 0.8rem; text-transform: uppercase; color: #888; font-weight: bold; letter-spacing: 1px; }
        .fc-correct-ans { font-size: 1.8rem; font-weight: bold; color: var(--duo-green); }
        .fc-user-ans { font-size: 1.1rem; color: var(--duo-text); }
        .fc-user-ans span { font-weight: bold; color: var(--duo-blue); }
        .fc-controls { display: flex; gap: 15px; justify-content: center; width: 100%; }
        .fc-btn { padding: 12px 20px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; font-size: 0.9rem; box-shadow: 0 3px 0 rgba(0,0,0,0.1); flex: 1; max-width: 120px; }
        .fc-btn:active { transform: translateY(3px); box-shadow: none; }
        .fc-know { background: var(--duo-green); color: white; }
        .fc-dontknow { background: var(--duo-red); color: white; }

        /* --- STATS & GUIDE --- */
        .stat-section { margin-bottom: 20px; width: 100%; max-width: 600px; }
        .stat-header { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .stat-list { display: flex; flex-direction: column; gap: 8px; }
        .stat-item { display: flex; justify-content: space-between; padding: 10px; background: #f9f9f9; border-radius: 8px; border-left: 5px solid #ccc; }
        .stat-item.strong { border-left-color: var(--duo-green); }
        .stat-item.weak { border-left-color: var(--duo-red); }
        .progress-bar-bg { width: 100px; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin-top: 5px; }
        .progress-fill { height: 100%; background: #ccc; }
        .guide-search { width: 100%; padding: 15px; font-size: 1rem; border: 2px solid var(--duo-gray); border-radius: 12px; margin-bottom: 20px; max-width: 600px; }
        .txt-zh { font-size: 1.4rem; font-weight: bold; line-height: 1.2; }
        .txt-py { font-size: 0.8rem; color: #888; display: block; margin-bottom: 2px; }
        .txt-pt { font-size: 1rem; font-weight: bold; }

        /* OVERLAYS */
        .screen-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: white; z-index: 50; padding: 20px; box-sizing: border-box; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        
        .menu-title { font-size: 1.8rem; font-weight: bold; color: var(--duo-green); margin-bottom: 10px; margin-top: 10px; }
        .total-score-display { font-size: 1.2rem; font-weight: bold; color: var(--duo-yellow); margin-bottom: 10px; background: #fff8e1; padding: 5px 15px; border-radius: 20px; border: 2px solid var(--duo-yellow); }
        .menu-logo { width: 90px; height: 90px; object-fit: cover; border-radius: 20px; margin-bottom: 5px; margin-top: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); border: 3px solid var(--duo-green); }
        .vocab-select-container { width: 100%; max-width: 600px; margin-bottom: 15px; }
        .vocab-select { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--duo-gray); font-size: 1rem; font-weight: bold; color: var(--duo-text); outline: none; background: #fff; }
        .vocab-select:focus { border-color: var(--duo-blue); }

        /* GRID LAYOUT FOR MENU */
        .mode-select { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
            width: 100%; 
            max-width: 600px; 
        }
        
        .mode-btn { 
            padding: 15px; border: 2px solid var(--duo-gray); border-radius: 16px; background: white; 
            text-align: center; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 0 #ccc; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .mode-btn:hover { transform: translateY(-2px); border-color: var(--duo-blue); }
        .mode-btn:active { transform: translateY(2px); box-shadow: none; }
        .mode-title { font-weight: bold; font-size: 1.1rem; display: block; margin-bottom: 5px; }
        .mode-desc { font-size: 0.85rem; color: #666; }

        .study-btn-container { margin-top: 20px; width: 100%; max-width: 600px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 30px; }
        .study-btn-container .mode-btn { background: #f8f9fa; }
        .badge { background: var(--duo-red); color: white; border-radius: 50%; padding: 2px 8px; font-size: 0.9rem; position: absolute; right: 10px; top: 10px; font-weight: bold; box-shadow: 0 2px 0 rgba(0,0,0,0.2); }

        /* Responsive Grid Adjustments */
        @media (min-width: 600px) {
            .mode-select, .study-btn-container { grid-template-columns: repeat(3, 1fr); }
        }

        .daily-goal-container { width: 100%; max-width: 600px; margin-bottom: 20px; text-align: left; }
        .daily-label { font-size: 0.9rem; color: #777; font-weight: bold; margin-bottom: 5px; display: flex; justify-content: space-between;}
        .daily-bar-bg { width: 100%; height: 12px; background: #eee; border-radius: 6px; overflow: hidden; }
        .daily-bar-fill { height: 100%; background: var(--duo-yellow); width: 0%; transition: width 0.5s; }

        .study-list { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 10px; margin-top: 20px; margin-bottom: 50px; }
        .study-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border: 2px solid var(--duo-gray); border-radius: 12px; background: #f9f9f9; }
        .trash-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; opacity: 0.5; padding: 10px; }
        .trash-btn:hover { opacity: 1; transform: scale(1.1); color: var(--duo-red); }
        #confetti-canvas { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 100; }
        @keyframes shake { 0%,100% {transform:translateX(0);} 25% {transform:translateX(-5px);} 75% {transform:translateX(5px);} }
        @keyframes flashRed { 0% {background-color: var(--bg-wrong);} 100% {background-color: white;} }
        @keyframes slideIn { from {opacity:0; transform:translateY(20px);} to {opacity:1; transform:translateY(0);} }
        .penalty-anim { position: absolute; color: var(--duo-red); font-weight: bold; font-size: 1.5rem; animation: floatUp 1s forwards; pointer-events: none; z-index: 100;}
        @keyframes floatUp { 0% {opacity:1; transform:translate(-50%, 0);} 100% {opacity:0; transform:translate(-50%, -50px);} }
        .check-btn { width: 100%; max-width: 200px; padding: 15px; background: var(--duo-green); color: white; border: none; border-radius: 25px; font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #46a302; margin-top: 20px; }
        .check-btn:active { transform: translateY(4px); box-shadow: none; }
        .check-btn.disabled { background: #ccc; box-shadow: none; cursor: default; }

        @media (max-height: 800px) {
            .menu-logo { width: 70px; height: 70px; margin-top: 5px; }
            .menu-title { font-size: 1.4rem; margin-top: 5px; margin-bottom: 5px; }
            .total-score-display { margin-bottom: 5px; padding: 2px 10px; font-size: 0.9rem; }
            .daily-goal-container { margin-bottom: 10px; }
            .vocab-select-container { margin-bottom: 10px; }
            .mode-select { gap: 5px; }
            .mode-btn { padding: 10px; }
            .mode-desc { display: none; }
            .study-btn-container { margin-top: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="top-row">
            <div style="font-size:24px; cursor:pointer" onclick="goToMenu()">✕</div>
            <div class="stats-container">
                <div class="streak-display" id="streak-el">🔥 0</div>
                <div class="xp-display" id="xp-el">💎 0</div>
            </div>
        </div>
        <div class="timer-container" id="timer-box">
            <div class="timer-bar" id="timer-bar"></div>
        </div>
    </header>

    <main id="game-area">
    </main>

    <div class="screen-overlay center-content" id="menu-screen">
        <img src="Gemini_Generated_Image_6b9fo6b9fo6b9fo6.png" alt="Mandarim Total Logo" class="menu-logo" onerror="this.style.display='none'">
        <div class="menu-title">Mandarim Total</div>
        <div class="total-score-display" id="menu-total-score">💎 Total XP: 0</div>
        
        <div class="daily-goal-container">
            <div class="daily-label"><span>Meta Diária</span> <span id="daily-text">0 / 100 XP</span></div>
            <div class="daily-bar-bg"><div class="daily-bar-fill" id="daily-bar"></div></div>
        </div>

        <div class="vocab-select-container">
            <select id="vocab-select" class="vocab-select" onchange="changeVocab(this.value)">
                <option value="duolingo" selected>📚 Vocabulário: Duolingo (Padrão)</option>
                <option value="hsk1">👶 Vocabulário: HSK 1 (Básico)</option>
                <option value="hsk2">👦 Vocabulário: HSK 2 (Elementar)</option>
                <option value="hsk3">🧑‍🎓 Vocabulário: HSK 3 (Intermédio)</option>
                <option value="radicals">🈴 Vocabulário: Radicais (214)</option>
            </select>
        </div>

        <div class="mode-select">
            <button class="mode-btn" onclick="startGame('easy')">
                <span class="mode-title">🍵 Zen (Fácil)</span>
                <span class="mode-desc">Sem tempo. 8 Pares de Cartas.</span>
            </button>

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'win') {
                playTone(523.25, 0, 0.2); playTone(659.25, 0.2, 0.2); playTone(783.99, 0.4, 0.4);
            } else if (type === 'flip') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            }
        }
        function playTone(freq, startTime, duration) {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = freq; gain.gain.setValueAtTime(0.1, audioCtx.currentTime + startTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + startTime + duration);
            osc.start(audioCtx.currentTime + startTime); osc.stop(audioCtx.currentTime + startTime + duration);
        }

                        if (v.pt === 'beber' && ['maçã', 'arroz', 'massa'].includes(o.pt)) return;
                        if (v.pt === 'comer' && ['chá', 'café', 'água'].includes(o.pt)) return;

                        const pt = `${s.pt} gosta de ${v.pt} ${o.pt}.`;
                        const zh = `${s.z}喜欢${v.z}${o.z}。`;
                        sentences.duolingo.push({
                            pt: pt,
                            blocks: [b(s.z, s.p), b("喜欢", "xǐhuan"), b(v.z, v.p), b(o.z, o.p), b("。", "")],
                            valid: [zh]
                        });
                        sentences.hsk1.push({
                             pt: pt,

        function initCanvas(char) {
            const canvas = document.getElementById('hanzi-canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            
            const bgCanvas = document.getElementById('hanzi-bg-canvas');
            const bgCtx = bgCanvas.getContext('2d', { willReadFrequently: true });

            // Draw Guide on BG Canvas
            bgCtx.font = "240px 'KaiTi', 'SimKai', 'serif'";
            bgCtx.textAlign = "center";
            bgCtx.textBaseline = "middle";
            bgCtx.fillStyle = "#f0f0f0"; // Light Gray Guide
            bgCtx.fillText(char, 150, 150);

            // Setup User Canvas
            ctx.lineWidth = 20; // Medium Brush
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#333';
            
            state.hanziCtx = ctx;
            state.isDrawing = false;
            
            // Unified Pointer Events
            canvas.onpointerdown = startDraw;
            canvas.onpointermove = draw;
            canvas.onpointerup = stopDraw;
            canvas.onpointercancel = stopDraw;
            canvas.onpointerout = stopDraw;
        }
        
        function getPos(e) {
            const canvas = document.getElementById('hanzi-canvas');
            const rect = canvas.getBoundingClientRect();
            // PointerEvent gives clientX/Y directly
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        function startDraw(e) {
            e.preventDefault();
            state.isDrawing = true;
            const canvas = document.getElementById('hanzi-canvas');
            canvas.setPointerCapture(e.pointerId); // Capture pointer
            const pos = getPos(e);
            state.lastX = pos.x;
            state.lastY = pos.y;
        }
        
        function draw(e) {
            e.preventDefault();
            if(!state.isDrawing) return;
            const pos = getPos(e);
            const ctx = state.hanziCtx;
            ctx.beginPath();
            ctx.moveTo(state.lastX, state.lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            state.lastX = pos.x;
            state.lastY = pos.y;
        }
        
        function stopDraw(e) {
            e.preventDefault();
            state.isDrawing = false;
             const canvas = document.getElementById('hanzi-canvas');
            canvas.releasePointerCapture(e.pointerId);
        }

        function clearCanvas() {
            const canvas = document.getElementById('hanzi-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0,0,canvas.width,canvas.height);
        }

        function toggleGuide() {
            const bg = document.getElementById('hanzi-bg-canvas');
            bg.style.display = bg.style.display === 'none' ? 'block' : 'none';
        }

        function checkHanziWriting(char) {
            const userCanvas = document.getElementById('hanzi-canvas');
            const userCtx = userCanvas.getContext('2d');
            
            // Re-draw guide in memory for strict comparison (Black)
            const refCanvas = document.createElement('canvas');
            refCanvas.width = 300; refCanvas.height = 300;
            const refCtx = refCanvas.getContext('2d');
            refCtx.font = "240px 'KaiTi', 'SimKai', 'serif'";
            refCtx.textAlign = "center";
            refCtx.textBaseline = "middle";
            refCtx.fillStyle = "black";
            refCtx.fillText(char, 150, 150);

            const userImg = userCtx.getImageData(0, 0, 300, 300).data;
            const refImg = refCtx.getImageData(0, 0, 300, 300).data;
            
            let matchCount = 0;
            let refCount = 0;
            let totalPixelCount = 0;

            for (let i = 0; i < userImg.length; i += 4 * 4) { 
                const userAlpha = userImg[i+3];
                const refAlpha = refImg[i+3];
                
                if (refAlpha > 100) {
                    refCount++;
                    if (userAlpha > 100) matchCount++;
                }
                if (userAlpha > 100) totalPixelCount++;
            }

            // Lowered Coverage Threshold to 15% because brush is thinner than font
            const coverage = refCount > 0 ? (matchCount / refCount) : 0;
            // Added Precision Check to prevent just filling the screen
            const precision = totalPixelCount > 0 ? (matchCount / totalPixelCount) : 0;
            
            const feedback = document.getElementById('hanzi-feedback');
            
            // Show guide for visual comparison
            document.getElementById('hanzi-bg-canvas').style.display = 'block';
            
            if (coverage > 0.15 && precision > 0.3) {
                feedback.innerHTML = `<span style="color:var(--duo-green)">Bom trabalho! (Cobriste ${(coverage*100).toFixed(0)}%)</span>`;
                playSfx('correct'); updateScore(15);
                state.quizIndex++;
                setTimeout(renderHanziLevel, 1500);
            } else {
                 feedback.innerHTML = `<span style="color:var(--duo-red)">Tenta cobrir melhor. (Só ${(coverage*100).toFixed(0)}%)</span>`;
                 playSfx('wrong');
            }
        }


        // --- NEW MODES: SENTENCE ASSEMBLE ---

        function renderAssembleLevel() {

            state.currentSentence = state.sentencePool[state.quizIndex];

            els.game.innerHTML = `
                <div class="assemble-container">
                    <div class="assemble-prompt">Traduz: "${state.currentSentence.pt}"</div>

        function moveBlock(el, index) {
            if(el.classList.contains('used')) return;
            playSfx('flip');
            el.classList.add('used');
            const blockData = state.shuffledBlocks[index];
            const dropZone = document.getElementById('drop-zone');
            const newBlock = document.createElement('div');
            newBlock.className = 'word-chip-placed';
            newBlock.innerHTML = `<span class="chip-py">${blockData.p}</span><span class="chip-zh">${blockData.z}</span>`;
            newBlock.onclick = () => {
                dropZone.removeChild(newBlock);
                el.classList.remove('used');
                const removeIdx = state.placedBlocks.findIndex(b => b.z === blockData.z && b.p === blockData.p);
                if (removeIdx > -1) state.placedBlocks.splice(removeIdx, 1);
            };
            dropZone.appendChild(newBlock);
            state.placedBlocks.push(blockData);
            speak(blockData.z, 'zh-CN');
        }

        function checkAssemble() {
            const userSentence = state.placedBlocks.map(b => b.z).join('');
            const isCorrect = state.currentSentence.valid.includes(userSentence);

        function insertChar(char) {
            const input = document.getElementById('write-input');
            const start = input.selectionStart;
            const end = input.selectionEnd;

            input.value = text.substring(0, start) + char + text.substring(end);
            input.selectionStart = input.selectionEnd = start + 1;
            input.focus();
        }

        function checkWrite() {
            const input = document.getElementById('write-input').value.trim();
            const cleanInput = input.replace(/[.,?!。，？！]/g, '').toLowerCase();
            const isCorrect = state.currentSentence.valid.some(valid => {
                const cleanValid = valid.replace(/[.,?!。，？！]/g, '').toLowerCase();

        // --- NEW MODES: SPEECH ---
        function startSpeechMode() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("O teu browser não suporta reconhecimento de voz (tenta Chrome ou Edge).");
                return;
            }
            state.activeVocab = [...vocab].sort(() => 0.5 - Math.random()).slice(0, 10); // 10 words
            state.quizIndex = 0; state.sessionScore = 0; state.streak = 0; updateStats();
            state.recognition = new SpeechRecognition();
            state.recognition.lang = 'zh-CN';
            state.recognition.continuous = false;
            state.recognition.interimResults = false;
            state.recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                checkSpeech(transcript);
                document.querySelector('.mic-btn').classList.remove('listening');
            };
            state.recognition.onerror = (event) => {
                let msg = "Erro desconhecido.";
                if(event.error === 'no-speech') msg = "Não detetei fala.";
                if(event.error === 'audio-capture') msg = "Microfone não encontrado.";
                if(event.error === 'not-allowed') msg = "Permissão de microfone negada.";
                document.querySelector('.mic-btn').classList.remove('listening');
                document.getElementById('speech-feedback').innerText = msg;
            };
            els.menu.style.display = 'none';

        function checkSpeech(transcript) {
            const target = state.activeVocab[state.quizIndex].zh;

        // --- ESTATÍSTICAS LOGIC ---
        function openStatsScreen() {
            els.menu.style.display = 'none';
            els.stats.style.display = 'flex';
            const allVocabPool = [
                ...vocabDatabase.duolingo, ...vocabDatabase.hsk1, ...vocabDatabase.hsk2, ...vocabDatabase.hsk3
            ].map(item => ({ zh: item[0], py: item[1], pt: item[2] }));

            const entries = Object.entries(wordStats).map(([zh, stats]) => {
                const total = stats.correct + stats.wrong;
                const ratio = total === 0 ? 0 : (stats.correct / total);
                const ref = allVocabPool.find(v => v.zh === zh) || { zh: zh, py: '?', pt: '?' };
                return { ...ref, stats, ratio, total };
            }).filter(x => x.total > 0);

            const strong = entries.filter(e => e.ratio > 0.6).sort((a,b) => b.ratio - a.ratio || b.total - a.total).slice(0, 5);
            const weak = entries.filter(e => e.ratio <= 0.6).sort((a,b) => a.ratio - b.ratio || b.total - a.total).slice(0, 5);
            renderStatsList('strong-list', strong, 'strong');
            renderStatsList('weak-list', weak, 'weak');
        }

        function renderStatsList(id, list, type) {
            const container = document.getElementById(id);
            container.innerHTML = '';
            if(list.length === 0) { container.innerHTML = '<div style="color:#888; padding:10px">Sem dados suficientes ainda.</div>'; return; }
            list.forEach(item => {
                const pct = Math.round(item.ratio * 100);
                const barColor = type === 'strong' ? 'var(--duo-green)' : 'var(--duo-red)';
                const el = document.createElement('div');
                el.className = `stat-item ${type}`;
                el.innerHTML = `<div style="flex-grow:1"><div style="font-weight:bold">${item.zh} <span style="font-weight:normal; color:#666">(${item.py})</span></div><div style="font-size:0.9rem">${item.pt}</div></div><div style="text-align:right"><div style="font-weight:bold; color:${barColor}">${pct}%</div><div class="progress-bar-bg"><div class="progress-fill" style="width:${pct}%; background:${barColor}"></div></div></div>`;
                container.appendChild(el);
            });
        }

        // --- GUIA DE ESTUDO LOGIC ---
        function openGuideScreen() { els.menu.style.display = 'none'; els.guide.style.display = 'flex'; filterGuide(''); }
        function filterGuide(query) {
            const container = document.getElementById('guide-list-container'); container.innerHTML = ''; const q = query.toLowerCase();
            const filtered = vocab.filter(w => w.zh.includes(q) || w.py.toLowerCase().includes(q) || w.pt.toLowerCase().includes(q));
            filtered.forEach(w => {
                const item = document.createElement('div'); item.className = 'study-item'; item.style.justifyContent = 'flex-start'; item.style.gap = '15px'; item.onclick = () => speak(w.zh, 'zh-CN');
                item.innerHTML = `<div style="font-size:1.5rem; font-weight:bold; color:var(--duo-text); min-width:60px">${w.zh}</div><div style="flex-grow:1"><div style="color:#888; font-size:0.9rem">${w.py}</div><div style="font-weight:bold; color:var(--duo-blue)">${w.pt}</div></div><div style="font-size:1.2rem">🔊</div>`;
                container.appendChild(item);
            });
        }

        // --- FLASHCARDS LOGIC REVISED ---
        function openFlashcards() { els.menu.style.display = 'none'; els.flashcard.style.display = 'flex'; loadNextFlashcard(); }
        function loadNextFlashcard() {
            const area = document.getElementById('fc-area'); area.innerHTML = '';
            let pool = studyList.length > 0 ? studyList : vocab;
            if(pool.length === 0) { area.innerHTML = "<div style='text-align:center; padding:20px'>A lista está vazia.</div>"; return; }
            state.currentFlashcard = pool[Math.floor(Math.random() * pool.length)];
            const card = document.createElement('div'); card.className = 'flashcard-container';
            card.innerHTML = `<div class="flashcard-inner" id="fc-inner"><div class="fc-face fc-front"><div><div class="fc-zh-main" onclick="speak('${state.currentFlashcard.zh}', 'zh-CN')">${state.currentFlashcard.zh}</div><div class="fc-py-main">${state.currentFlashcard.py}</div></div><input type="text" id="fc-user-input" class="fc-input" placeholder="Escreva o significado..." onkeydown="if(event.key==='Enter') checkFlashcard()"><div class="fc-buttons-row"><button class="fc-giveup-btn" onclick="giveUpFlashcard()">Não Sei</button><button class="fc-check-btn" onclick="checkFlashcard()">Verificar</button></div></div><div class="fc-face fc-back"><div class="fc-mini-header"><span class="fc-mini-zh">${state.currentFlashcard.zh}</span><span class="fc-mini-py">${state.currentFlashcard.py}</span></div><div class="fc-result-area"><div><div class="fc-label">Correto:</div><div class="fc-correct-ans">${state.currentFlashcard.pt}</div></div><div><div class="fc-label">A tua resposta:</div><div class="fc-user-ans" id="fc-user-display"></div></div></div><div class="fc-controls"><button class="fc-btn fc-dontknow" onclick="nextFlashcard(false)">Ainda não</button><button class="fc-btn fc-know" onclick="nextFlashcard(true)">Já Sei!</button></div></div></div>`;
            area.appendChild(card);
            setTimeout(() => { const input = document.getElementById('fc-user-input'); if(input) input.focus(); }, 100);
        }
        function checkFlashcard() {
            const input = document.getElementById('fc-user-input').value; document.getElementById('fc-user-display').innerText = input || "(Vazio)";
            document.getElementById('fc-inner').classList.add('flipped'); playSfx('flip'); speak(state.currentFlashcard.zh, 'zh-CN');
        }
        function giveUpFlashcard() {
            document.getElementById('fc-user-display').innerHTML = "<span style='color:red'>Não sabia</span>"; document.getElementById('fc-inner').classList.add('flipped'); playSfx('wrong'); speak(state.currentFlashcard.zh, 'zh-CN'); updateScore(-2); 
        }
        function nextFlashcard(known) {
            if(known) {
                const idx = studyList.findIndex(w => w.zh === state.currentFlashcard.zh); if(idx > -1) { removeFromStudy(idx); }
                trackWordResult(state.currentFlashcard, true); updateScore(5); playSfx('correct');
            } else { addToStudy(state.currentFlashcard); trackWordResult(state.currentFlashcard, false); }
            loadNextFlashcard();
        }

        // --- 8. ESTUDO/ERROS SCREEN ---
        function openStudyScreen() { els.menu.style.display = 'none'; els.study.style.display = 'flex'; renderStudyList(); }
        function renderStudyList() {
            const container = document.getElementById('study-list-container'); const emptyMsg = document.getElementById('study-empty-msg'); container.innerHTML = '';
            if (studyList.length === 0) { emptyMsg.style.display = 'block'; return; }
            emptyMsg.style.display = 'none';
            [...studyList].reverse().forEach((w, i) => {
                const originalIndex = studyList.length - 1 - i; const item = document.createElement('div'); item.className = 'study-item';
                item.innerHTML = `<div class="study-info" onclick="speak('${w.zh}', 'zh-CN')"><span style="font-size:1.2rem; font-weight:bold; color:var(--duo-text)">${w.zh}</span><span style="font-size:0.9rem; color:#888">${w.py}</span><span style="font-size:1rem; color:var(--duo-blue); font-weight:bold">${w.pt}</span></div><button class="trash-btn" onclick="removeFromStudy(${originalIndex})">🗑️</button>`;
                container.appendChild(item);
            });
        }

        // --- 9. GAMEPLAY LOGIC (MATCH & QUIZ) ---
        function startGame(mode) {
            state.isQuizMode = false;
            let numPairs;
            if (mode === 'easy') { numPairs = 8; state.penalty = 2; state.maxTime = 0; } 
            else if (mode === 'normal') { numPairs = 10; state.penalty = 5; state.maxTime = 60; } 
            else if (mode === 'hard') { numPairs = 12; state.penalty = 10; state.maxTime = 45; els.game.classList.add('hard-mode'); } 
            else { els.game.classList.remove('hard-mode'); }
            state.totalPairs = numPairs; state.sessionScore = 0; state.matchesFound = 0; state.streak = 0;
            updateStats();
            state.activeVocab = [...vocab].sort(() => 0.5 - Math.random()).slice(0, numPairs);
            const leftSide = state.activeVocab.map((w, i) => ({...w, id: i, side: 'pt'})).sort(() => 0.5 - Math.random());
            const rightSide = state.activeVocab.map((w, i) => ({...w, id: i, side: 'zh'})).sort(() => 0.5 - Math.random());
            renderBoard(leftSide, rightSide);
            els.menu.style.display = 'none';
            if (state.maxTime > 0) { els.timerBox.style.display = 'block'; startTimer(state.maxTime); }
        }

        function startQuizMode() {
            state.isQuizMode = true; state.sessionScore = 0; state.streak = 0; state.quizIndex = 0; updateStats();
            const targets = [...vocab].sort(() => 0.5 - Math.random()).slice(0, 10);
            state.quizQuestions = targets.map(target => {
                const wrongs = [];
                while(wrongs.length < 3) {
                    const w = vocab[Math.floor(Math.random() * vocab.length)];
                    if(w.zh !== target.zh && !wrongs.includes(w.pt)) wrongs.push(w.pt);
                }
                const opts = [target.pt, ...wrongs].sort(()=>0.5-Math.random());
                return { q: `Como se diz "${target.zh}" (${target.py}) em Português?`, opts: opts, correct: opts.indexOf(target.pt), vocabRef: target };
            });
            els.menu.style.display = 'none'; els.game.classList.remove('hard-mode');
            renderQuizQuestion();
        }

        // --- RENDERIZADORES DE JOGO ---
        function renderBoard(leftCards, rightCards) {
            els.game.innerHTML = `<div class="game-board"><div class="column" id="col-pt"><div class="column-title">Português</div></div><div class="column" id="col-zh"><div class="column-title">Mandarim</div></div></div>`;
            const colPt = document.getElementById('col-pt'); const colZh = document.getElementById('col-zh');
            leftCards.forEach(c => colPt.appendChild(createCard(c, 'pt')));
            rightCards.forEach(c => colZh.appendChild(createCard(c, 'zh')));
        }
        function createCard(data, type) {
            const el = document.createElement('div'); el.className = 'card';
            el.innerHTML = type==='zh' ? `<span class="txt-py">${data.py}</span><span class="txt-zh">${data.zh}</span>` : `<span class="txt-pt">${data.pt}</span>`;
            el.onclick = () => handleCardClick(el, data, type);
            return el;
        }
        function renderQuizQuestion() {
            if(state.quizIndex >= state.quizQuestions.length) { gameOver(true); return; }
            const q = state.quizQuestions[state.quizIndex];
            els.game.innerHTML = `<div class="quiz-container"><div class="quiz-question">${q.q}</div><div class="quiz-options">${q.opts.map((opt, i) => `<button class="quiz-btn" onclick="handleQuizAnswer(this, ${i})"><span>${opt}</span></button>`).join('')}</div></div>`;
        }

        // --- HANDLERS ---
        function handleCardClick(el, data, type) {
            if (state.isLocked || el.classList.contains('matched') || el.classList.contains('selected')) return;
            speak(type === 'zh' ? data.zh : data.pt, type === 'zh' ? 'zh-CN' : 'pt-PT');
            el.classList.add('selected');
            if (!state.firstCard) { state.firstCard = { el, data, type }; } 
            else {
                state.isLocked = true; const secondCard = { el, data, type };
                if (state.firstCard.type === secondCard.type) { state.firstCard.el.classList.remove('selected'); state.firstCard = secondCard; state.isLocked = false; return; }
                if (state.firstCard.data.id === secondCard.data.id) handleMatch(state.firstCard, secondCard); else handleMismatch(state.firstCard, secondCard);
            }
        }
        function handleMatch(c1, c2) {
            state.matchesFound++; state.streak++;
            updateScore(10 + (state.streak * 2)); updateStats();
            trackWordResult(c1.data, true); 
            playSfx('correct');
            setTimeout(() => { c1.el.classList.remove('selected'); c2.el.classList.remove('selected'); c1.el.classList.add('matched'); c2.el.classList.add('matched'); state.firstCard = null; state.isLocked = false; if (state.matchesFound === state.totalPairs) gameOver(true); }, 300);
        }
        function handleMismatch(c1, c2) {
            state.streak = 0; updateStats(); updateScore(-state.penalty);
            const w1 = state.activeVocab[c1.data.id]; const w2 = state.activeVocab[c2.data.id];
            if(w1) { addToStudy(w1); trackWordResult(w1, false); } 
            if(w2) { addToStudy(w2); trackWordResult(w2, false); }
            c1.el.classList.add('wrong'); c2.el.classList.add('wrong');
            playSfx('wrong');
            setTimeout(() => { c1.el.classList.remove('selected', 'wrong'); c2.el.classList.remove('selected', 'wrong'); state.firstCard = null; state.isLocked = false; }, 1000);
        }
        function handleQuizAnswer(btn, idx) {
            if(state.isLocked) return; state.isLocked = true;
            const q = state.quizQuestions[state.quizIndex];
            if(idx === q.correct) {
                btn.classList.add('correct'); state.streak++; updateScore(15 + (state.streak * 2)); speak("Correto!", "pt-PT");
                trackWordResult(q.vocabRef, true); 
                playSfx('correct');
            } else {
                btn.classList.add('wrong'); document.querySelectorAll('.quiz-btn')[q.correct].classList.add('correct');
                state.streak = 0; updateScore(-5); speak("Errado.", "pt-PT");
                addToStudy(q.vocabRef); trackWordResult(q.vocabRef, false); 
                playSfx('wrong');
            }
            updateStats();
            setTimeout(() => { state.quizIndex++; state.isLocked = false; renderQuizQuestion(); }, 1500);
        }

        // --- SISTEMA GLOBAL ---
        function updateScore(amount) {
            state.sessionScore = Math.max(0, state.sessionScore + amount);
            totalXP = Math.max(0, totalXP + amount);
            localStorage.setItem('mandarim_total_xp', totalXP);
            
            // Daily XP update
            if(amount > 0) {
                dailyXP += amount;
                localStorage.setItem('mandarim_daily_xp', dailyXP);
                checkDailyReset();
            }

            const anim = document.createElement('div'); anim.className = 'penalty-anim';
            anim.innerText = amount > 0 ? `+${amount}` : `${amount}`;
            anim.style.color = amount > 0 ? 'var(--duo-yellow)' : 'var(--duo-red)';
            anim.style.left = '50%'; anim.style.top = '50%';
            document.body.appendChild(anim); setTimeout(()=>anim.remove(), 1000);
            els.xp.innerText = `💎 ${totalXP}`;
        }
        function updateStats() { els.streak.innerText = `🔥 ${state.streak}`; }
        function startTimer(seconds) {
            state.timeLeft = seconds; els.timerBar.style.width = '100%'; els.timerBar.classList.remove('critical');
            state.timer = setInterval(() => {
                state.timeLeft -= 0.1; const pct = (state.timeLeft / state.maxTime) * 100;
                els.timerBar.style.width = `${pct}%`;
                if (state.timeLeft <= 5) els.timerBar.classList.add('critical');
                if (state.timeLeft <= 0) gameOver(false);
            }, 100);
        }
        function gameOver(win) {
            clearInterval(state.timer); state.isLocked = true;
            if(win) fireConfetti(); // Trigger confetti
            setTimeout(() => {
                els.end.style.display = 'flex';
                document.getElementById('end-emoji').innerText = win ? "🏆" : "⏰";
                document.getElementById('end-title').innerText = win ? "Nível Completo!" : "Acabou o Tempo!";
                document.getElementById('end-msg').innerText = `Ganhaste ${state.sessionScore} XP!`;
                if(win) playSfx('win');
                speak(win ? "Muito bem!" : "Que pena.", "pt-PT");
                els.endTotal.innerText = `XP Total Acumulado: ${totalXP}`;
            }, 500);
        }
        function speak(text, lang) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = 0.9;
                const voices = window.speechSynthesis.getVoices();
                if(lang === 'zh-CN') { const v = voices.find(x => x.lang.includes('zh')); if(v) u.voice = v; }
                window.speechSynthesis.speak(u);
            }
        }

        // --- CONFETTI SIMPLE ---
        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const particles = [];
            const colors = ['#58cc02', '#1cb0f6', '#ffc800', '#ff4b4b', '#9b59b6'];
            
            for(let i=0; i<150; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 8 + 4,
                    speed: Math.random() * 5 + 2,
                    angle: Math.random() * 2 * Math.PI
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                particles.forEach(p => {
                    p.y += p.speed;
                    p.x += Math.sin(p.angle) * 2;
                    p.angle += 0.1;
                    if(p.y < canvas.height) active = true;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                });
                if(active) requestAnimationFrame(animate);
                else ctx.clearRect(0,0,canvas.width,canvas.height);
            }
            animate();
        }

        window.speechSynthesis.getVoices();
        goToMenu(); 
    </script>
